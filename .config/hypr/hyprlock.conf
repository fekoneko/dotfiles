general {
    hide_cursor = true
}

background {
    path = screenshot
    blur_passes = 2
    blur_size = 5
    vibrancy = 0
}

shape {
    size = 100%, 100%
    position = 0, 0
    halign = left
    valign = top

    color = rgba(1c1c1e88)
}

input-field {
    size = 600, 90
    position = 0, -180
    halign = center
    valign = center

    placeholder_text =
    check_text = Authenticating...
    fail_text = $PAMFAIL$FPRINTFAIL

    font_size = 50
    dots_spacing = 0.3
    outline_thickness = 3
    fade_on_empty = false
    rounding = 15

    font_color = rgb(afafaf)
    inner_color = rgba(00000000)
    outer_color = rgb(000000000)
    check_color = rgba(ebdeab00)
    fail_color = rgba(ff99a200)
    numlock_color = rgba(00000000)
    capslock_color = rgba(00000000)
    bothlock_color = rgba(00000000)
}

# TIME
label {
    position = 0, 70
    halign = center
    valign = center

    text = $TIME
    font_size = 120
}

# DATE
label {
    position = 0, -80
    halign = center
    valign = center

    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 25
}
