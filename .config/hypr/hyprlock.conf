general {
    hide_cursor = true
    fractional_scaling = 0
}

background {
    path = screenshot
    blur_passes = 2
    blur_size = 5
    vibrancy = 0
}

shape {
    size = 100%, 100%
    position = 0, 0
    halign = left
    valign = top

    color = rgba(1c1c1e88)
}

input-field {
    size = 600, 90
    position = 0, -180
    halign = center
    valign = center

    placeholder_text =
    check_text = Authenticating...
    fail_text = $PAMFAIL$FPRINTFAIL

    dots_spacing = 0.3
    outline_thickness = 3
    fade_on_empty = false
    rounding = 15

    font_color = rgb(afafaf)
    inner_color = rgba(00000000)
    outer_color = rgba(00000000)
    check_color = rgba(ebdeab00)
    fail_color = rgba(ff99a200)
    numlock_color = rgba(00000000)
    capslock_color = rgba(00000000)
    bothlock_color = rgba(00000000)
}

label {
    position = 0, 70
    halign = center
    valign = center

    text = $TIME
    font_size = 120
}

label {
    position = 0, -80
    halign = center
    valign = center

    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 25
    color = rgb(dfdfdf)
}

label {
    position = 45, -29
    halign = left
    valign = top

    text = 　
    font_size = 23
    color = rgba(ffffff55)
}

label {
    position = 90, -26
    halign = left
    valign = top

    text = $LAYOUT[en,ru,jp]
    font_size = 22
    color = rgba(ffffff55)
}
